name: GTA 6 weekly briefing

on:
  schedule:
    # Friday 13:00 UTC = 9:00 AM America/New_York (EDT)
    - cron: "0 13 * * 5"
  workflow_dispatch: # lets you click Run workflow anytime

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python gta6_automation.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: gta6-intelligence-report
          path: gta6_intelligence_report_*.md
          if-no-files-found: warn
